name: Daily Database Backup

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/backup.yml']

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PGDATABASE: ${{ secrets.DATABASE_URL }}
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: '30'
    steps:
      - name: Normalize database connection for PostgreSQL tools
        shell: python
        run: |
          import os
          from urllib.parse import urlsplit, urlunsplit, parse_qsl, urlencode
          uri = urlsplit(os.environ['PGDATABASE'])
          if uri.scheme not in ('postgres', 'postgresql'):
              raise SystemExit('DATABASE_URL must be a PostgreSQL connection URI')
          query = [(k, v) for k, v in parse_qsl(uri.query) if k not in ('pgbouncer', 'connection_limit', 'pool_timeout', 'schema')]
          authority = uri.netloc
          # Dumps require a direct or session connection, not the transaction pooler.
          if uri.hostname and uri.hostname.endswith('.pooler.supabase.com') and uri.port == 6543:
              authority = authority.rsplit(':', 1)[0] + ':5432'
          normalized = urlunsplit((uri.scheme, authority, uri.path, urlencode(query), ''))
          print('::add-mask::' + normalized)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('PGDATABASE=' + normalized + '\n')

      - name: Back up the entire database including table data
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$PGDATABASE" || { echo "::error::DATABASE_URL secret is missing"; exit 1; }
          mkdir -p backups
          # Pass the URI inside the container; never print credentials.
          # No schema or table filters: includes public, auth, storage metadata and custom schemas.
          docker run --rm --network host -e PGDATABASE -e PGSSLMODE -e PGCONNECT_TIMEOUT \
            -v "$PWD/backups:/backup" postgres:17 \
            sh -c 'exec pg_dump --dbname="$PGDATABASE" --format=custom --file=/backup/database.dump --no-password'
          docker run --rm --network host -e PGDATABASE -e PGSSLMODE -e PGCONNECT_TIMEOUT \
            -v "$PWD/backups:/backup" postgres:17 \
            sh -c 'exec pg_dumpall --dbname="$PGDATABASE" --roles-only --no-role-passwords --file=/backup/roles.sql --no-password'

      - name: Verify archive and actual data
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/backups:/backup" postgres:17 \
            pg_restore --list /backup/database.dump > backups/contents.txt
          grep -q ' TABLE DATA public ' backups/contents.txt
          # Read/decompress every archive entry, not just its header.
          docker run --rm -v "$PWD/backups:/backup" postgres:17 \
            pg_restore --file=/dev/null /backup/database.dump
          # Check for actual COPY records without exposing any records in logs/artifacts.
          docker run --rm -v "$PWD/backups:/backup" postgres:17 \
            pg_restore --data-only --file=- /backup/database.dump | python3 -c '
          import sys, json
          tables = {}
          table = None
          for line in sys.stdin:
              if line.startswith("COPY "):
                  table = line.split(" (", 1)[0][5:]
                  tables[table] = 0
              elif line.rstrip("\n") == "\\.":
                  table = None
              elif table is not None:
                  tables[table] += 1
          if not any(n for t, n in tables.items() if t.startswith("public.")):
              raise SystemExit("No public table records in backup; refusing success")
          with open("backups/row-counts.json", "w") as f:
              json.dump(tables, f, indent=2)
          print("Verified table data and non-empty public records.")
          '
          test -s backups/roles.sql
          cd backups
          sha256sum database.dump roles.sql contents.txt row-counts.json > SHA256SUMS
          sha256sum --check SHA256SUMS
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          Database archive verified: schema, table records, sequences, functions, policies,
          grants and large objects, plus roles without database login passwords.
          Auth records and Storage metadata are included. Storage file bytes and external
          services (for example Google Drive) are separate from PostgreSQL.
          The archive was read in full and public records were verified; this is not a
          complete restore rehearsal. Retention: 90 days.
          SUMMARY

      - name: Upload verified full database backup
        uses: actions/upload-artifact@v4
        with:
          name: full-database-backup-${{ github.run_id }}
          path: backups/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

