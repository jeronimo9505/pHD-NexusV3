name: Daily Database Backup

on:
  schedule:
    - cron: '0 3 * * *' # Every day at 03:00 UTC (Early morning in EU/LATAM)
  workflow_dispatch:   # Allows manual trigger from GitHub UI

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create backup directory
        run: mkdir -p backups

      - name: Generate Database Dump
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # The DB URL should be the connection string (Transaction pooler or Session)
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          # We use npx to run supabase without global installation
          npx supabase db dump --db-url "$DATABASE_URL" -f "backups/backup_$TIMESTAMP.sql"

      - name: Gzip Backup (Optional but recommended)
        run: |
          gzip backups/*.sql

      - name: Upload to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: database-backups-${{ github.run_id }}
          path: backups/
          retention-days: 90 # Keep backups for 3 months
