name: Telegram secret guard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan tracked files and newly introduced commits
        env:
          SECURITY_SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-telegram-secrets.mjs
