name: Telegram secret guard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Checkout's early credential cleanup fails on the repository's legacy
          # unconfigured gitlink. Remove it from the ephemeral CI index first.
          persist-credentials: true
      - name: Prepare ephemeral scan index and clear checkout credentials
        run: |
          git update-index --force-remove -- scratch/SPECTROview
          git config --local --unset-all http.https://github.com/.extraheader || true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan tracked files and newly introduced commits
        env:
          SECURITY_SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-telegram-secrets.mjs
